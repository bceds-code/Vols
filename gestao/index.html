<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltec Gestão</title>
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0b0c0e;color:#fff;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#aviso{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#aviso img{width:160px;height:auto}
#aviso button{font:600 16px system-ui,sans-serif;padding:12px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff}
</style></head>
<body>
<div id="aviso"><img src="icon-512.png" alt=""><p id="txt">Abrindo…</p><button type="button" id="tentar" hidden>Tentar de novo</button></div>
<script src="../config.js"></script>
<script>
(function(){
  var url=(window.VOLTEC_EXEC||'').trim(), txt=document.getElementById('txt'), bt=document.getElementById('tentar');
  function abre(){
    if(!url){txt.textContent='Falta colocar o link do app em config.js.';return}
    if(navigator.onLine===false){txt.textContent='Sem internet. Conecte e toque em Tentar de novo.';bt.hidden=false;return}
    bt.hidden=true;txt.textContent='Abrindo…';
    var f=document.createElement('iframe');f.title='Voltec Gestão';f.src=url+'?p=gestao';
    f.allow='camera; clipboard-write';document.body.appendChild(f);
  }
  bt.onclick=function(){location.reload()};
  abre();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body></html>
